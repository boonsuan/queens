name = "queens"
version = "0.1.0"
defaultTargets = ["Queens"]
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Queens"]

[leanOptions]
autoImplicit = false
weak.linter.mathlibStandardSet = true
# This downstream project does not prescribe a Mathlib copyright/license header.
weak.linter.style.header = false

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "d13f23b723b8a846827a245b89c10fc7d3f11612"

[[lean_lib]]
name = "Queens"
