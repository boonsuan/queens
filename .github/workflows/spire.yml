# Spire is checked against the Section 7 generator: each job builds both from a clean checkout
# and compares Spire's checksums with ones computed from the generator's rows (spire/check.py,
# a minute or two in all). The jobs cover the assembly loops (x86-64), the C loops on ARM64
# Linux and on Apple Silicon, and the C loops on x86-64. They run whenever either program
# changes.
name: Spire

on:
  push:
    branches: [main]
    paths:
      - 'spire/**'
      - 'fast_generator/**'
      - 'oeis/results/history-40.json'
      - '.github/workflows/spire.yml'
  pull_request:
    branches: [main]
    paths:
      - 'spire/**'
      - 'fast_generator/**'
      - 'oeis/results/history-40.json'
      - '.github/workflows/spire.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spire-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64 (assembly loops)
            os: ubuntu-24.04
            make: make
          - name: Linux x86-64 (C loops)
            os: ubuntu-24.04
            make: make PORTABLE=1
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            make: make
          - name: macOS Apple Silicon
            os: macos-15
            make: make
    defaults:
      run:
        working-directory: spire
        shell: bash
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Show the processor
        run: |
          if [ "$RUNNER_OS" = macOS ]; then sysctl -n machdep.cpu.brand_string; else grep -m1 -E 'model name|CPU part' /proc/cpuinfo || true; fi
          uname -m

      - name: Build
        run: ${{ matrix.make }}

      - name: Compare with the Section 7 generator
        run: ${{ matrix.make }} check
